name: Native Windows release verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-verification
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch public verification script at this exact commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @('verify-windows.ps1','release-config.json','manifest-v1.json','manifest-v1.json.sig')) {
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/$name" -OutFile "$env:RUNNER_TEMP/$name" -TimeoutSec 60
          }
      - name: Execute native Windows PowerShell acceptance
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/verify-windows.ps1"
          if (-not $?) { exit 1 }
