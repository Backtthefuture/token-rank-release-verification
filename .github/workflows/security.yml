name: Windows antivirus inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-antivirus-inspection
  cancel-in-progress: false
jobs:
  defender:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch inspection script at this exact commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/security-scan.ps1" -OutFile "$env:RUNNER_TEMP/security-scan.ps1" -TimeoutSec 60
      - name: Scan held artifact without executing it
        id: scan
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP/security-scan.ps1"
          if (-not $?) { exit 1 }
      - name: Upload inspection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-rank-windows-antivirus-receipt
          path: ${{ runner.temp }}/token-rank-security-scan/security-scan-receipt.json
          if-no-files-found: error
          retention-days: 30
